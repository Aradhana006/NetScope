<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetScope — See the network clearly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="landing-body">
    <div class="landing-bg" aria-hidden="true"></div>

    <div class="landing-page">
      <nav class="top-nav container">
        <div class="logo">Net<span>Scope</span></div>
        <div class="nav-links">
          <a href="{{ url_for('login_page') }}">Login</a>
          <a class="btn-primary small" href="{{ url_for('signup_page') }}">Sign up</a>
        </div>
      </nav>

      <main class="landing-main container">
        <header class="hero">
          <div class="hero-copy">
            <p class="eyebrow">Network &amp; DNS diagnostics</p>
            <h1>See the Internet<br />more clearly.</h1>
            <p class="hero-text">One place for DNS, connectivity, and health checks.</p>
            <div class="hero-actions">
              <a class="btn-primary" href="{{ url_for('dashboard') }}">Continue as guest</a>
              <a class="btn-ghost" href="{{ url_for('signup_page') }}">Create account</a>
            </div>
          </div>
          <div class="hero-visual" aria-hidden="true">
            <div class="orbital">
              <div class="core"></div>
              <div class="ring r1"></div>
              <div class="ring r2"></div>
              <div class="ring r3"></div>
            </div>
          </div>
        </header>

        <section class="features" aria-label="Highlights">
          <article class="feature-card"><h3>DNS</h3><p>Records, TTL, transport.</p></article>
          <article class="feature-card"><h3>Network</h3><p>Ping, TCP, HTTP.</p></article>
          <article class="feature-card"><h3>Insights</h3><p>Health score &amp; tips.</p></article>
          <article class="feature-card"><h3>History</h3><p>Save &amp; PDF when signed in.</p></article>
        </section>
      </main>

    </div>
  </body>
</html>
