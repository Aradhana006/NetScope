<!DOCTYPE html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login — NetScope</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  </head>

  <body class="auth-body">

    <nav class="auth-nav">

      <a href="{{ url_for('landing') }}" class="logo">Net<span>Scope</span></a>

      <div class="auth-nav-links">

        <a href="{{ url_for('login_page') }}" class="auth-nav-active">Log in</a>

        <a class="btn-primary small" href="{{ url_for('signup_page') }}">Sign up</a>

      </div>

    </nav>

    <div class="auth-card">

      <a href="{{ url_for('landing') }}" class="logo center auth-logo-mobile">Net<span>Scope</span></a>

      <h1>Welcome back</h1>

      {% if current_user %}

      <p class="auth-notice">Signed in as {{ current_user.email }}. <a href="{{ url_for('dashboard') }}">Go to dashboard</a> or log in with another account below.</p>

      {% endif %}

      <form id="login-form">

        <label>Email<input type="email" id="email" required autocomplete="email" /></label>

        <label>Password<input type="password" id="password" required autocomplete="current-password" /></label>

        <p id="auth-error" class="form-error hidden"></p>

        <button type="submit" class="btn-primary full">Log in</button>

      </form>

      <p class="auth-switch">No account? <a href="{{ url_for('signup_page') }}" id="login-signup-link">Sign up</a></p>

      <p class="auth-switch"><a href="{{ url_for('dashboard') }}">Continue as guest</a></p>

    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>

  </body>

</html>
